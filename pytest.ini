[pytest]
testpaths = tests/unit

markers =
    slow: spawns a subprocess (sushic, clang, the packager CLI). Applied automatically
        by tests/unit/conftest.py to every module that imports subprocess, so
        `pytest -m "not slow"` is the fast inner-loop tier.
    runner: a test of the test runner, under tests/unit/runner/. It may start the runner
        and the compiler. Applied by tests/unit/runner/conftest.py to every test there, so
        `pytest -m "not runner"` is the fast Python layer.
    writes_the_checkout: a runner test that writes a thing every runner test reads (a
        staged fixture in tests/, the leak interposer, the stdlib or the helper libraries).
        Under `pytest -n` it holds the checkout lock alone.
