[pytest]
testpaths = tests/unit
addopts = -m "not runner"

markers =
    slow: spawns a subprocess (sushic, clang, the packager CLI). Applied automatically
        by tests/unit/conftest.py to every module that imports subprocess, so
        `pytest -m "not slow"` is the fast inner-loop tier.
    runner: a test of the test runner, under tests/unit/runner/. It may start the runner
        and the compiler, and it writes the checkout. Applied by tests/unit/runner/conftest.py
        to every test there. The runner tests do NOT run by default (`addopts`); run them
        with `uv run pytest -q -m runner`, one instance at a time, in a worktree that
        nothing else uses. A runner test on a `pytest -n` worker fails at once.
