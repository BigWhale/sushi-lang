name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-stdlib-linux:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    steps:
      - name: Install git and checkout deps
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get install -y wget curl build-essential cmake gnupg lsb-release

      - name: Install LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/trixie/ llvm-toolchain-trixie-20 main" | tee /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y llvm-20 llvm-20-dev

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build stdlib
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          LLVM_CONFIG=/usr/bin/llvm-config-20 uv sync
          uv run python sushi_lang/sushi_stdlib/build.py

      - name: Upload Linux stdlib
        uses: actions/upload-artifact@v7
        with:
          name: stdlib-linux
          path: sushi_lang/sushi_stdlib/dist/linux/
          # The .build_fingerprint marker is a hidden file, and upload-artifact drops
          # hidden files by default -- without it the installed compiler scores the
          # shipped bitcode stale and tries to rebuild.
          include-hidden-files: true

  build-stdlib-darwin:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install LLVM
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install llvm@20
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Build stdlib
        run: |
          export LLVM_CONFIG=$(brew --prefix llvm@20)/bin/llvm-config
          uv sync --python 3.13
          uv run python sushi_lang/sushi_stdlib/build.py

      - name: Upload Darwin stdlib
        uses: actions/upload-artifact@v7
        with:
          name: stdlib-darwin
          path: sushi_lang/sushi_stdlib/dist/darwin/
          include-hidden-files: true

  build-wheel:
    needs: [build-stdlib-linux, build-stdlib-darwin]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Linux stdlib
        uses: actions/download-artifact@v8
        with:
          name: stdlib-linux
          path: sushi_lang/sushi_stdlib/dist/linux/

      - name: Download Darwin stdlib
        uses: actions/download-artifact@v8
        with:
          name: stdlib-darwin
          path: sushi_lang/sushi_stdlib/dist/darwin/

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Build wheel
        run: uv build --wheel --python 3.13

      - name: Assert the wheel is complete
        # A wheel with no bitcode or no markers "builds" fine and fails on every user
        # machine -- exactly the 0.11.0 release failure. Fail HERE, with the inventory.
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          LISTING=$(unzip -l "$WHEEL")
          BC_COUNT=$(echo "$LISTING" | grep -c "\.bc$" || true)
          echo "bitcode files in wheel: $BC_COUNT"
          test "$BC_COUNT" -gt 0 || { echo "FATAL: wheel contains no stdlib bitcode"; exit 1; }
          for plat in linux darwin; do
            echo "$LISTING" | grep -q "sushi_stdlib/dist/$plat/.build_fingerprint" \
              || { echo "FATAL: wheel is missing the $plat .build_fingerprint marker"; exit 1; }
          done
          echo "$LISTING" | grep -q "sushi_stdlib/build.py" \
            || { echo "FATAL: wheel is missing sushi_stdlib/build.py (the freshness fingerprint hashes it)"; exit 1; }

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl

  test-wheel-linux:
    needs: [build-wheel]
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl build-essential

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/

      - name: Install Python 3.13
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.13

      - name: Run e2e release tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          PYTHON=$(uv python find 3.13)
          WHEEL=$(ls dist/*.whl | head -1)
          $PYTHON tests/e2e/run_release_test.py --wheel "$WHEEL"

  test-wheel-darwin:
    needs: [build-wheel]
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/

      - name: Run e2e release tests
        run: |
          PYTHON=$(uv python find 3.13)
          WHEEL=$(ls dist/*.whl | head -1)
          $PYTHON tests/e2e/run_release_test.py --wheel "$WHEEL"

  publish-release:
    needs: [test-wheel-linux, test-wheel-darwin]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/

      - name: Upload wheel to release
        # Attach the wheel ONLY. The release body is hand-written at publish time and
        # carries no issue/PR references; body_path used to overwrite it with the
        # changelog section, which does.
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
