name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

jobs:
  # Stage 0: lint. Cheap (seconds) and blocking - the quality gate Tier 5.1
  # installed so the F821/F841 bug class cannot regenerate.
  lint:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for code changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'sushi_lang/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'sushic'

      - name: Set up Sushi toolchain
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-sushi

      # `tests` is linted too (#274): the harness is the gate every claim
      # rests on, and #241 was a harness bug that made 96 leak assertions
      # silently inert.
      - name: Run ruff
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check sushi_lang tests .github/scripts docs/hooks

      # Tier 4.1 layering gate (#276): semantics must never import backend.
      # The documented grep, run for real. tests/unit/test_layering_gate.py
      # holds the stronger checks (every import form, and the #239-shape
      # import-isolation discriminator).
      - name: Layering gate (semantics must not import backend)
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          if grep -rn "sushi_lang\.backend" sushi_lang/semantics/; then
            echo "semantics must never import backend (Tier 4.1)"
            exit 1
          fi

      # Blocking over the mypy-clean packages (the Tier 5.2 ratchet); grow this
      # list as later waves land. Keep in sync with MYPY_PKGS in .githooks/pre-push.
      - name: Run mypy (ratcheted packages, blocking)
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run mypy sushi_lang/internals sushi_lang/compiler sushi_lang/packager sushi_lang/sushi_stdlib

      # Full-tree count, never blocking: makes backlog drift visible in the log.
      - name: Run mypy (full tree, informational)
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run mypy sushi_lang | tail -2 || true

  pytest:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for code changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'sushi_lang/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'sushic'

      - name: Set up Sushi toolchain
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-sushi

      - name: Run unit tests (pytest)
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Absolute path: --junit-xml has resolved relative to cwd vs rootdir differently
          # across pytest majors, and the badges job has to find the file afterwards.
          uv run pytest -q --junit-xml="$GITHUB_WORKSPACE/pytest-report.xml"

      # !cancelled(), not success(): a FAILING pytest run is precisely the run whose
      # numbers the badge must publish. Only a cancellation leaves nothing worth reading.
      - name: Upload pytest report
        # Must match the `badges` job's condition exactly, main-only ref check included: an
        # event that publishes a badge but uploads nothing renders "unavailable" and
        # publishes that as red, and uploading where nothing publishes is dead weight.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main'
                && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 1
          if-no-files-found: error

  # Stage 2: leak gate on both platforms, after pytest and before the full suites.
  # Uses the malloc-interposer (tests/leakcheck), which runs in hosted CI on both
  # Linux and macOS (unlike `leaks`, which cannot attach on the hosted macOS runner).
  # --leaks-only is a SELECTOR, not a stronger check: the stage 3 full suites enforce
  # EXPECT_NO_LEAKS too. This stage exists to fail fast over the ~350 annotated tests
  # instead of the whole corpus.
  leaks-linux:
    needs: pytest
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for code changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'sushi_lang/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'sushic'

      - name: Set up Sushi toolchain
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-sushi

      - name: Run leak gate
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run python tests/run_tests.py --leaks-only

  leaks-macos:
    needs: pytest
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for code changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'sushi_lang/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'sushic'

      - name: Set up Sushi toolchain
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-sushi
        with:
          python-version: '3.13'

      - name: Run leak gate
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --python 3.13 python tests/run_tests.py --leaks-only

  # Stage 3: the full suites, only after the leak gate passes on both platforms.
  test-linux:
    needs: [leaks-linux, leaks-macos]
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for code changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'sushi_lang/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'sushic'

      - name: Set up Sushi toolchain
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-sushi

      - name: Run tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # pipefail so a failing runner is not masked by tee's exit status. This job is
          # the gate AND the source of the sushi badge, so both have to stay honest.
          set -o pipefail
          uv run python tests/run_tests.py --enhanced --json | tee corpus-results.json

      # if-no-files-found: error is load-bearing. A runner that died before emitting
      # anything must fail this job, not hand the badge step an empty file to guess at.
      - name: Upload corpus results
        # Must match the `badges` job's condition exactly, main-only ref check included: an
        # event that publishes a badge but uploads nothing renders "unavailable" and
        # publishes that as red, and uploading where nothing publishes is dead weight.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main'
                && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v7
        with:
          name: corpus-results
          path: corpus-results.json
          retention-days: 1
          if-no-files-found: error

  test-macos:
    needs: [leaks-linux, leaks-macos]
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for code changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'sushi_lang/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'sushic'

      - name: Set up Sushi toolchain
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-sushi
        with:
          python-version: '3.13'

      - name: Run tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --python 3.13 python tests/run_tests.py --enhanced

      - name: Docs-vs-code stdlib smoke check (macOS backend)
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --python 3.13 python -m pytest tests/unit/test_docs_stdlib_smoke.py -q

  # Badge publication. Three properties the job this replaced did not have:
  #   - it never runs a suite itself; it consumes THIS run's artifacts, so the badge
  #     cannot disagree with the gate it claims to describe;
  #   - it publishes on a failing run too, because that is the run whose numbers matter;
  #   - every failure is fatal. A badge that cannot be computed is not published, since a
  #     stale green is worse than a missing badge.
  #
  # main ONLY, and that is a correctness rule rather than a preference. The README embeds
  # three fixed gist URLs holding one value each, so a branch that published would repaint
  # the public README with its own numbers -- a red WIP branch over a green main. `on.push`
  # is already pinned to main; the ref check is what stops workflow_dispatch, which can be
  # fired from any branch, from doing the same through the back door. Note also that the
  # concurrency group below is keyed on the ref, so it would NOT serialise two different
  # branches against each other.
  badges:
    needs: [pytest, test-linux, test-macos]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main'
            && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # No container and no setup-sushi: make_badges.py is stdlib-only, so the runner's
    # system python3 is enough -- seconds instead of a full toolchain install.
    concurrency:
      # Two quick merges must not race on the gist PATCH; the older publish loses.
      group: badges-${{ github.ref }}
      cancel-in-progress: true
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

    steps:
      - name: Checkout badge script
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # continue-on-error, deliberately: a missing artifact means the producing job died,
      # and the badge must then go RED rather than the workflow failing and leaving
      # yesterday's green in place. make_badges.py separates "missing because the job
      # failed" (render red) from "missing although the job succeeded" (fatal).
      - name: Download pytest report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pytest-report

      - name: Download corpus results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: corpus-results

      - name: Render badges
        run: |
          python3 .github/scripts/make_badges.py \
            --corpus corpus-results.json \
            --corpus-job-result "${{ needs['test-linux'].result }}" \
            --pytest pytest-report.xml \
            --pytest-job-result "${{ needs.pytest.result }}" \
            --macos-job-result "${{ needs['test-macos'].result }}" \
            --payload gist_payload.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Select the Gist for this repository
        run: |
          if [ "${{ github.repository }}" = "BigWhale/sushi-lang" ]; then
            echo "GIST_ID=5bfbd5156dec23acfe18dd7956e251ba" >> "$GITHUB_ENV"
          else
            echo "GIST_ID=e893b92ba7b7561fae565f832f83159d" >> "$GITHUB_ENV"
          fi

      # env (not secrets) in a step `if:` is the fork-safe idiom: a fork pushing to its own
      # main still renders and validates the badges, and skips only the publish.
      # --fail-with-body matters -- the old curl had no --fail, so a 401 from an expired
      # token printed "Successfully updated Gist".
      - name: Publish badges to Gist
        if: ${{ env.GIST_TOKEN != '' }}
        run: |
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/$GIST_ID" \
            --data @gist_payload.json

      - name: Note skipped publish
        if: ${{ env.GIST_TOKEN == '' }}
        run: echo "No GIST_TOKEN in this repository -- badges were rendered but not published."
